[pytest]
# 리포 안의 packages/ 를 **설치본보다 앞세운다**.
#
# 같은 이름(hwpx_core·hwpx_skeleton …)의 다른 판이 파이썬에 설치돼 있으면 그쪽을
# 시험하고도 통과했다고 나온다. 이 리포가 스스로 자기 소스를 앞에 두게 한다 —
# 어느 인터프리터로 돌려도 같다.
pythonpath =
    packages/hwpx-core/src
    packages/hwpx-skeleton/src
    packages/hwpx-reader/src
    packages/hwpx-report-policy/src
    packages/hwpx-writer/src

testpaths = packages
norecursedirs = venv output skill/hwpx/scripts/vendor .git
